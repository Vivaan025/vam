name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HUB_CACHE: ${{ github.workspace }}/.hf_cache
  TORCH_HOME: ${{ github.workspace }}/.torch_cache

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Cache Hugging Face hub
        uses: actions/cache@v4
        with:
          path: .hf_cache
          key: hf-${{ runner.os }}-${{ hashFiles('tests/test_preprocess.py') }}
      - name: Install CPU torch
        run: python -m pip install --upgrade pip && python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install vam
        run: python -m pip install -e ".[hf,dev]"
      - name: Lint
        run: python -m ruff check vam tests benchmarks scripts examples
      - name: Test
        run: python -m pytest -q -m "not slow"

  wheel:
    name: wheel installs and runs the quickstart (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache Hugging Face hub
        uses: actions/cache@v4
        with:
          path: .hf_cache
          key: hf-quickstart-${{ runner.os }}
      - name: Build
        run: python -m pip install --upgrade pip build && python -m build --wheel
      - name: Install the wheel into a clean venv (no repository on sys.path)
        shell: bash
        run: |
          python -m venv /tmp/clean
          if [ "$RUNNER_OS" = "Windows" ]; then PY=/tmp/clean/Scripts/python.exe; else PY=/tmp/clean/bin/python; fi
          $PY -m pip install --upgrade pip
          $PY -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          $PY -m pip install "$(ls dist/*.whl)[hf]"
          cp examples/quickstart.py examples/make_sample.py /tmp/
          cd /tmp && $PY -c "import vam; from vam.sampling import default_scorer; print(vam.__version__, vam.list_models())"
          cd /tmp && $PY make_sample.py sample.mp4 && $PY quickstart.py sample.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl
