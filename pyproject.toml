[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vam"
version = "0.1.0"
description = "Unified library and runtime for video-action models: recognition, prediction and streaming"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Vivaan" }]
dependencies = [
    "torch>=2.2",
    "numpy>=1.24",
    "opencv-python>=4.8",
]

[project.optional-dependencies]
hf = ["transformers>=4.40", "pillow"]
dev = ["pytest>=8", "ruff"]

[tool.setuptools.packages.find]
include = ["vam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
